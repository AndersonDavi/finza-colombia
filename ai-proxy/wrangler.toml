# Free assistant for Finza: forwards the app's Gemini calls with a key kept
# as a secret. Publish with:
#   npx wrangler deploy
#   npx wrangler secret put GEMINI_API_KEY   (paste the key when asked)
name = "finza-ia"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://finza.pages.dev,http://127.0.0.1:8769,http://localhost:8769"

# Requests per address and minute; Gemini's free tier also has its own limits
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 8
  period = 60
