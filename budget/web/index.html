<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="google-signin-client_id" content="508693869238-vkpk65et04q4k9o3rntjlqplpqas611o.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Finza">
  <link rel="apple-touch-icon" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/pg" href="favicon/png"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#000000">

  <title>Finza</title>
  <link rel="manifest" href="manifest.json">

  <meta name="title" content="Finza" />
  <meta name="description" content="A budget and financial tracking application designed for you" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cashewapp.web.app/assets/preview.png" />
  <meta property="og:title" content="Finza" />
  <meta property="og:description" content="A budget and financial tracking application designed for you" />
  <meta property="og:image" content="https://cashewapp.web.app/assets/preview.png" />

  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://cashewapp.web.app/assets/preview.png" />
  <meta property="twitter:title" content="Finza" />
  <meta property="twitter:description" content="A budget and financial tracking application designed for you" />
  <meta property="twitter:image" content="https://cashewapp.web.app/assets/preview.png" />

</head>
<body oncontextmenu="return false;">
  <style>
    @media (prefers-color-scheme: dark) {
      body {
        background-color: black;
      }
    }
  </style>
  <script defer src="sql-wasm.js"></script>
  <div id="loading">
    <style>
      body {
        inset: 0;
        overflow: hidden;
        margin: 0;
        padding: 0;
        position: fixed;
      }

      #loading {
        align-items: center;
        display: flex;
        height: 100%;
        justify-content: center;
        width: 100%;
      }

      #loading .loading-spinner, #loading .loading-icon {
        transition: opacity 0.5s;
      }

      #loading.main_done .loading-spinner {
        opacity: 0;
      }

      #loading.init_done .loading-spinner, #loading.init_done .loading-icon {
        /* animation: .33s ease-in-out 0s 1 forwards zoom; */
        opacity: 0;
      }

      .loading-spinner {
        margin: 40px 10px;
        display: inline-block;
        width: 45px;
        height: 45px;
        border: 4px solid rgba(255,255,255,.3);
        border-radius: 50%;
        border-top-color: #e3e7ff;
        animation: spin 1s linear infinite;
        opacity: .66;
      }

      .column{
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .loading-icon{
        margin: 40px 10px;
        width: min(30vh, 30vw);
        height: min(30vh, 30vw);
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
    <div class="column">
      <img src="./icons/Icon.png" class="loading-icon"/>
      <div class="loading-spinner"></div>
    </div>
  </div>
  <!-- Shown by flutter_bootstrap.js only if loading fails or takes too long -->
  <div id="load-problem">
    <style>
      #load-problem {
        display: none;
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        max-height: 60vh;
        overflow: auto;
        padding: 16px;
        border-radius: 16px;
        background: #ECEAF6;
        color: #1C1B22;
        font-family: -apple-system, system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #load-problem { background: #23212F; color: #EDEBF5; }
      }
      #load-problem .title { font-weight: 700; font-size: 17px; margin-bottom: 6px; }
      #load-problem .hint { font-size: 14px; margin-bottom: 10px; opacity: .8; }
      #load-problem .details {
        white-space: pre-wrap;
        word-break: break-word;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        opacity: .75;
        margin: 10px 0 0;
      }
      #load-problem button {
        border: 0;
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        background: #5A5791;
        color: #FFFFFF;
      }
    </style>
    <div class="title"></div>
    <div class="hint">Toma una captura de este mensaje y vuelve a intentar.</div>
    <button onclick="location.reload()">Recargar</button>
    <pre class="details"></pre>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
